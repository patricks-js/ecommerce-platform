name: jala-sales-api

services:
  jala-sales-db:
    container_name: jala-sales-db
    image: bitnami/postgresql:16
    restart: always
    env_file:
      - .env.docker
    ports:
      - 5432:5432
    volumes:
      - jala-sales-db-data:/bitnami/postgresql
    networks:
      - jala-sales-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "docker"]
      interval: 10s
      timeout: 5s
      retries: 5

  jala-sales-api:
    container_name: jala-sales-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - 3333:3333
    depends_on:
      - jala-sales-db
    networks:
      - jala-sales-network

networks:
  jala-sales-network:
    driver: bridge

volumes:
  jala-sales-db-data:
