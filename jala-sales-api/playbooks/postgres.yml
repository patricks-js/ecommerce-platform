---
- name: Deploy PostgreSQL container using Docker
  hosts: localhost
  become: true
  tasks:
    - name: Create Docker network
      community.docker.docker_network:
        name: ansible_network
        state: present

    - name: Run PostgreSQL container
      community.docker.docker_container:
        name: postgres
        image: postgres:latest
        networks:
          - name: ansible_network
        state: started
        restart_policy: always
        env:
          POSTGRES_USER: "admin"
          POSTGRES_PASSWORD: "password"
          POSTGRES_DB: "sonar"
        ports:
          - "5431:5432"

    - name: Wait for PostgreSQL to be ready
      ansible.builtin.shell: |
        until pg_isready -h 127.0.0.1 -p 5431; do
          sleep 2
        done
      register: pg_ready
      retries: 5
      delay: 2
      failed_when: pg_ready.rc != 0
      changed_when: false
